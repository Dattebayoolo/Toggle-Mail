<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toggle Mail – Pakistan's Sovereign Email Platform</title>
  <meta name="description" content="Toggle Mail is Pakistan's secure, sovereign email platform with Google Material 3 UI, Urdu support, and local Islamabad data hosting.">

  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/google-sans">

  <!-- App Stylesheets -->
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/email-view.css">
  <link rel="stylesheet" href="/css/side-panel.css">
  <link rel="stylesheet" href="/css/urdu-rtl.css">

  <!-- Service Worker / Cache Buster: Unregister any stale worker on localhost -->
  <script>
    (function() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          if (registrations.length > 0) {
            console.warn('[ToggleMail] Unregistering stale ServiceWorker(s)...');
            Promise.all(registrations.map(function(r) { return r.unregister(); })).then(function() {
              if ('caches' in window) {
                caches.keys().then(function(names) {
                  return Promise.all(names.map(function(n) { return caches.delete(n); }));
                }).then(function() {
                  console.warn('[ToggleMail] ServiceWorkers & caches cleared, reloading cleanly...');
                  window.location.reload();
                });
              } else {
                window.location.reload();
              }
            });
          }
        });
      }
    })();
  </script>

  <style>
    /* ═══════════════════════════════════════════════════════════════════════════
       TOGGLE MAIL – MODERN GOOGLE MATERIAL 3 UI SYSTEM
       ═══════════════════════════════════════════════════════════════════════════ */

    #app-root {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background-color: var(--bg-app);
      font-family: var(--font-sans);
    }

    /* ─── Top Header Bar ─── */
    #app-header {
      height: var(--header-height);
      background-color: var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      gap: 16px;
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
      z-index: 50;
      transition: background-color var(--transition-fast), border-color var(--transition-fast);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 250px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      border: none;
      background: transparent;
      outline: none;
      position: relative;
      overflow: hidden;
    }
    .icon-btn:hover {
      background-color: var(--bg-hover);
      color: var(--text-primary);
      transform: scale(1.04);
    }
    .icon-btn:active {
      transform: scale(0.96);
    }

    .brand-logo-link {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      user-select: none;
    }
    .brand-logo-svg {
      width: 44px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .brand-logo-link:hover .brand-logo-svg {
      transform: scale(1.06);
    }
    .brand-logo-svg svg {
      width: 44px;
      height: 26px;
      display: block;
      transition: filter 0.2s ease;
    }
    .brand-logo-link:hover .brand-logo-svg svg {
      filter: drop-shadow(0 3px 8px rgba(11, 102, 35, 0.35));
    }
    .brand-text-container {
      display: flex;
      align-items: center;
    }
    .brand-name {
      font-family: 'Google Sans', 'Product Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
    }
    .brand-name .highlight {
      background: linear-gradient(135deg, #0b6623 0%, #1a73e8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-left: 2px;
      font-weight: 700;
    }
    [data-theme="dark"] .brand-name .highlight {
      background: linear-gradient(135deg, #4ade80 0%, #8ab4f8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Google Search Box */
    .header-center {
      flex: 1;
      max-width: 720px;
    }
    #search-form {
      width: 100%;
    }
    .search-box {
      display: flex;
      align-items: center;
      background-color: var(--bg-surface-variant);
      border-radius: 24px;
      height: 48px;
      padding: 0 16px;
      gap: 12px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid transparent;
    }
    .search-box:focus-within {
      background-color: var(--bg-surface);
      box-shadow: 0 1px 3px 0 rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15);
      border-color: var(--border-color);
    }
    .search-icon {
      color: var(--text-secondary);
      font-size: 22px;
    }
    #search-input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 15px;
      color: var(--text-primary);
      font-family: inherit;
    }
    .search-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    /* Header Right */
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sovereign-status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(11, 102, 35, 0.08);
      border: 1px solid rgba(11, 102, 35, 0.25);
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 600;
      color: var(--color-primary);
      user-select: none;
      transition: all 0.2s;
    }
    [data-theme="dark"] .sovereign-status-pill {
      background: rgba(74, 222, 128, 0.1);
      border-color: rgba(74, 222, 128, 0.3);
      color: #4ade80;
    }
    .status-dot-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--color-primary);
      box-shadow: 0 0 0 0 rgba(11, 102, 35, 0.7);
      animation: pulse-ring 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(11, 102, 35, 0.6); }
      70% { box-shadow: 0 0 0 8px rgba(11, 102, 35, 0); }
      100% { box-shadow: 0 0 0 0 rgba(11, 102, 35, 0); }
    }

    .profile-avatar-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0b6623, #15803d);
      color: white;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 2px solid var(--bg-surface);
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      transition: transform 0.15s ease;
    }
    .profile-avatar-btn:hover {
      transform: scale(1.08);
    }

    /* ─── App Body Layout ─── */
    #app-body {
      display: flex;
      flex: 1;
      height: calc(100vh - var(--header-height));
      overflow: hidden;
      position: relative;
    }

    /* ─── Google Material 3 Sidebar Navigation ─── */
    #app-sidebar, #sidebar {
      width: var(--sidebar-width);
      height: 100%;
      background-color: var(--bg-app);
      display: flex;
      flex-direction: column;
      padding: 12px 12px 16px;
      gap: 4px;
      flex-shrink: 0;
      overflow-y: auto;
      overflow-x: hidden;
      transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1), background-color var(--transition-fast);
      user-select: none;
    }

    /* Floating Material 3 Compose Button */
    #sidebar-compose-btn, #compose-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, var(--color-primary-container) 0%, var(--bg-surface) 120%);
      color: var(--color-on-primary-container);
      border-radius: 16px;
      padding: 0 24px;
      height: 56px;
      min-height: 56px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 1px 3px 0 rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      margin-bottom: 12px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.4);
      width: fit-content;
      outline: none;
    }
    #sidebar-compose-btn:hover, #compose-btn:hover {
      box-shadow: 0 2px 6px 2px rgba(60,64,67,.25), 0 8px 16px 4px rgba(60,64,67,.12);
      transform: translateY(-2px);
      filter: brightness(1.02);
    }
    #sidebar-compose-btn:active, #compose-btn:active {
      transform: translateY(0);
      box-shadow: 0 1px 2px rgba(60,64,67,.3);
    }
    #sidebar-compose-btn .material-symbols-outlined, #compose-btn .material-symbols-outlined {
      font-size: 24px;
      color: var(--color-primary);
    }

    /* Sidebar Folder Items */
    .sidebar-nav-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sidebar-nav-item, .nav-item {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      height: 36px;
      padding: 0 16px 0 24px;
      border-radius: 0 18px 18px 0;
      margin-right: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      text-align: left;
      border: none;
      background: transparent;
      outline: none;
    }
    .sidebar-nav-item:hover, .nav-item:hover {
      background-color: var(--bg-hover);
      color: var(--text-primary);
    }
    .sidebar-nav-item.active, .nav-item.active {
      background-color: var(--bg-sidebar-active);
      color: var(--text-primary);
      font-weight: 700;
    }
    .sidebar-nav-item.active .nav-icon,
    .sidebar-nav-item.active .sidebar-nav-icon,
    .nav-item.active .nav-icon {
      font-variation-settings: 'FILL' 1, 'wght' 600;
      color: var(--color-primary);
    }
    .sidebar-nav-icon, .nav-icon {
      font-size: 20px;
      width: 20px;
      text-align: center;
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    .sidebar-nav-label, .nav-label {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sidebar-nav-count, .nav-badge {
      margin-left: auto;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      padding: 2px 6px;
      border-radius: var(--radius-full);
    }

    /* Labels & Storage */
    .sidebar-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 6px 24px;
    }
    .sidebar-section-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-tertiary);
    }
    .sidebar-label-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .storage-widget {
      margin-top: auto;
      margin-bottom: 8px;
      padding: 14px 16px;
      background-color: var(--bg-surface-variant);
      border-radius: 14px;
      border: 1px solid var(--border-subtle);
      font-size: 12px;
      transition: all var(--transition-fast);
    }
    .storage-widget:hover {
      border-color: var(--border-color);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    .storage-widget-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .storage-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .storage-icon {
      font-size: 18px;
      color: var(--color-google-blue);
    }
    .storage-percent {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-surface);
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
    }
    .storage-bar-track {
      width: 100%;
      height: 6px;
      background-color: var(--border-color);
      border-radius: 999px;
      overflow: hidden;
      margin: 8px 0;
    }
    .storage-bar-fill {
      width: 49.6%;
      height: 100%;
      background: linear-gradient(90deg, #1a73e8 0%, #34a853 100%);
      border-radius: 999px;
      transition: width 0.3s ease;
    }
    .storage-meta {
      display: flex;
      justify-content: space-between;
      color: var(--text-tertiary);
      font-size: 11.5px;
      margin-bottom: 8px;
    }
    .storage-manage-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--color-google-blue);
      text-decoration: none;
      transition: opacity 0.15s ease;
    }
    .storage-manage-link:hover {
      text-decoration: underline;
      opacity: 0.85;
    }

    /* ─── Collapsed Rail Mode (when Hamburger is clicked) ─── */
    #app-sidebar.collapsed, #sidebar.collapsed {
      width: var(--sidebar-collapsed-width);
      padding: 12px 8px;
      align-items: center;
    }
    #app-sidebar.collapsed .sidebar-nav-label,
    #app-sidebar.collapsed .sidebar-nav-count,
    #app-sidebar.collapsed .nav-label,
    #app-sidebar.collapsed .nav-badge,
    #app-sidebar.collapsed .sidebar-section-header,
    #app-sidebar.collapsed #sidebar-labels,
    #app-sidebar.collapsed .sidebar-section-title,
    #app-sidebar.collapsed .storage-widget,
    #app-sidebar.collapsed .compose-btn-text,
    #sidebar.collapsed .sidebar-nav-label,
    #sidebar.collapsed .sidebar-nav-count,
    #sidebar.collapsed .nav-label,
    #sidebar.collapsed .nav-badge,
    #sidebar.collapsed .sidebar-section-header,
    #sidebar.collapsed #sidebar-labels,
    #sidebar.collapsed .sidebar-section-title,
    #sidebar.collapsed .storage-widget,
    #sidebar.collapsed .compose-btn-text {
      display: none !important;
    }
    #app-sidebar.collapsed #sidebar-compose-btn,
    #sidebar.collapsed #sidebar-compose-btn,
    #app-sidebar.collapsed #compose-btn,
    #sidebar.collapsed #compose-btn {
      width: 48px;
      height: 48px;
      min-height: 48px;
      padding: 0;
      border-radius: 16px;
      margin: 0 auto 12px auto;
      justify-content: center;
    }
    #app-sidebar.collapsed .nav-item,
    #sidebar.collapsed .nav-item,
    #app-sidebar.collapsed .sidebar-nav-item,
    #sidebar.collapsed .sidebar-nav-item {
      justify-content: center;
      padding: 0;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      margin: 2px auto;
    }
    #app-sidebar.collapsed .nav-icon,
    #sidebar.collapsed .nav-icon,
    #app-sidebar.collapsed .sidebar-nav-icon,
    #sidebar.collapsed .sidebar-nav-icon {
      font-size: 24px;
      margin: 0;
    }

    /* ─── Main Content Area ─── */
    #main-content-area {
      display: flex;
      flex-direction: column;
      flex: 1;
      height: 100%;
      background-color: var(--bg-surface);
      border-radius: 16px 16px 0 0;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 10px rgba(0,0,0,0.03);
      margin-right: 0;
    }

    /* Category Tabs */
    #category-tabs {
      display: flex;
      align-items: stretch;
      border-bottom: 1px solid var(--border-subtle);
      background-color: var(--bg-surface);
      padding: 0 8px;
      min-height: 48px;
    }
    .category-tab {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      border-bottom: 3px solid transparent;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      position: relative;
      border-top: none;
      border-left: none;
      border-right: none;
      background: transparent;
      outline: none;
    }
    .category-tab .material-symbols-outlined {
      font-size: 20px;
    }
    .category-tab:hover {
      background-color: var(--bg-hover);
      color: var(--text-primary);
    }
    .category-tab.active {
      color: var(--color-google-blue);
      border-bottom-color: var(--color-google-blue);
      font-weight: 600;
    }
    .category-tab.active .material-symbols-outlined {
      font-variation-settings: 'FILL' 1;
    }
    .cat-badge {
      background: var(--color-google-blue);
      color: white;
      border-radius: 10px;
      font-size: 11px;
      padding: 1px 7px;
      font-weight: 700;
      margin-left: 4px;
    }

    /* List Actions Toolbar */
    #list-actions-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 16px;
      height: 48px;
      border-bottom: 1px solid var(--border-subtle);
      background-color: var(--bg-surface);
    }
    .actions-left, .actions-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Bulk Actions Bar */
    #bulk-actions-bar {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      background: var(--bg-selected);
      border-bottom: 1px solid var(--border-color);
      height: 48px;
      animation: bulk-slide 0.15s ease;
    }
    @keyframes bulk-slide {
      from { transform: translateY(-100%); }
      to { transform: translateY(0); }
    }

    /* ─── Email List View ─── */
    #email-list-view {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }
    #email-list {
      flex: 1;
      overflow-y: auto;
      background-color: var(--bg-surface);
    }

    /* Email Row */
    .email-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      height: 48px;
      border-bottom: 1px solid var(--border-row);
      cursor: pointer;
      transition: background-color var(--transition-fast), box-shadow var(--transition-fast);
      position: relative;
      user-select: none;
    }
    .email-row:hover {
      box-shadow: inset 1px 0 0 var(--border-color), inset -1px 0 0 var(--border-color), 0 1px 2px 0 rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
      z-index: 2;
      background-color: var(--bg-hover);
    }
    .email-row.unread {
      font-weight: 700;
      background-color: var(--bg-surface);
      color: var(--text-primary);
    }
    .email-row.read {
      font-weight: 400;
      background-color: var(--bg-surface-variant);
      color: var(--text-secondary);
    }
    .email-row.selected {
      background-color: var(--bg-selected) !important;
    }

    .email-row-left {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .email-row-checkbox-wrap {
      position: relative;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .email-avatar-wrap {
      position: absolute;
      transition: opacity 0.15s ease;
    }
    .email-checkbox {
      position: absolute;
      width: 18px;
      height: 18px;
      opacity: 0;
      cursor: pointer;
      accent-color: var(--color-primary);
      transition: opacity 0.15s ease;
    }
    .email-row:hover .email-avatar-wrap {
      opacity: 0;
    }
    .email-row:hover .email-checkbox {
      opacity: 1;
    }
    .email-row.selected .email-avatar-wrap {
      opacity: 0;
    }
    .email-row.selected .email-checkbox {
      opacity: 1;
    }
    .email-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }

    .email-star-btn {
      color: var(--text-tertiary);
      transition: transform 0.15s ease, color 0.15s ease;
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      outline: none;
    }
    .email-star-btn:hover {
      background-color: rgba(0,0,0,0.06);
      transform: scale(1.15);
    }
    .star-filled {
      color: #f9ab00 !important;
      font-variation-settings: 'FILL' 1;
    }

    .email-row-body {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }
    .email-sender {
      font-size: 14px;
      white-space: nowrap;
      min-width: 160px;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }
    .email-important-icon {
      font-size: 16px;
      color: #f9ab00;
      font-variation-settings: 'FILL' 1;
      flex-shrink: 0;
    }
    .email-subject {
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
    }
    .email-snippet {
      font-size: 14px;
      color: var(--text-snippet);
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .email-attachment-icon {
      font-size: 18px;
      color: var(--text-tertiary);
      flex-shrink: 0;
    }
    .email-label-chip {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .email-row-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      min-width: 150px;
      justify-content: flex-end;
    }
    .email-hover-actions {
      display: none;
      gap: 2px;
      background: var(--bg-hover);
      padding-left: 8px;
    }
    .email-row:hover .email-hover-actions {
      display: flex;
    }
    .email-row:hover .email-date {
      display: none;
    }
    .email-date {
      font-size: 12px;
      color: var(--text-tertiary);
      white-space: nowrap;
    }

    /* ─── Email Detail View ─── */
    #email-detail-view {
      display: none;
      flex-direction: column;
      overflow-y: auto;
      flex: 1;
      background-color: var(--bg-surface);
    }
    .detail-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border-color);
    }
    .detail-toolbar-actions {
      display: flex;
      gap: 4px;
    }
    .toolbar-divider {
      width: 1px;
      height: 24px;
      background: var(--border-color);
      margin: 0 4px;
    }
    .detail-content {
      padding: 24px 48px;
      max-width: 900px;
    }
    .detail-subject {
      font-size: 24px;
      font-weight: 400;
      color: var(--text-primary);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .detail-meta-row {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 20px;
    }
    .detail-sender-info {
      flex: 1;
    }
    .detail-from-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .detail-from-email {
      font-size: 13px;
      color: var(--text-tertiary);
      font-weight: 400;
    }
    .detail-to-line, .detail-date {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-top: 2px;
    }
    .detail-security-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #e8f5e9;
      border: 1px solid #c8e6c9;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      color: #1e4620;
      margin-bottom: 24px;
      font-weight: 500;
    }
    [data-theme="dark"] .detail-security-banner {
      background: #0d2b1e;
      border-color: #1b5e20;
      color: #81c784;
    }
    .detail-body {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-primary);
    }
    .detail-attachments {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
    }
    .detail-attachments-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }
    .detail-attachments-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .attachment-card {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      transition: all var(--transition-fast);
      min-width: 240px;
      background: var(--bg-surface-variant);
    }
    .attachment-card:hover {
      background: var(--bg-hover);
      box-shadow: var(--shadow-sm);
    }
    .detail-reply-bar {
      display: flex;
      gap: 12px;
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--border-color);
    }
    .detail-reply-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      background: var(--bg-surface);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .detail-reply-btn:hover {
      background: var(--bg-hover);
      border-color: var(--color-primary);
    }

    /* ─── Floating Compose Window ─── */
    .compose-window {
      position: fixed;
      bottom: 0;
      right: 24px;
      width: 560px;
      background: var(--bg-compose);
      border-radius: 12px 12px 0 0;
      box-shadow: var(--shadow-compose);
      z-index: 9000;
      display: flex;
      flex-direction: column;
      max-height: 85vh;
      border: 1px solid var(--border-color);
      border-bottom: none;
      overflow: hidden;
      animation: compose-slide-up 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes compose-slide-up {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .compose-maximized {
      width: 90vw;
      height: 90vh;
      top: 5vh;
      right: 5vw;
      bottom: auto;
      border-radius: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .compose-minimized {
      height: 48px;
      overflow: hidden;
    }
    .compose-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--bg-surface-variant);
      border-bottom: 1px solid var(--border-subtle);
      cursor: move;
      user-select: none;
    }
    .compose-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .compose-field-row {
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      padding: 6px 16px;
      gap: 10px;
    }
    .compose-field-label {
      font-size: 13px;
      color: var(--text-secondary);
      min-width: 28px;
    }
    .compose-field-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 14px;
      color: var(--text-primary);
      padding: 4px 0;
      font-family: inherit;
    }
    .compose-body {
      flex: 1;
      padding: 16px;
      min-height: 200px;
      outline: none;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-primary);
      overflow-y: auto;
    }
    .compose-urdu-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-surface-variant);
      overflow-x: auto;
    }
    .compose-urdu-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--color-primary);
      flex-shrink: 0;
    }
    .compose-urdu-chips {
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
    }
    .compose-urdu-chip {
      font-size: 13px;
      font-family: var(--font-urdu);
      padding: 4px 10px;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      cursor: pointer;
      color: var(--text-primary);
      background: var(--bg-surface);
      transition: all var(--transition-fast);
      white-space: nowrap;
    }
    .compose-urdu-chip:hover {
      background: var(--color-primary-container);
      color: var(--color-on-primary-container);
      border-color: transparent;
    }
    .compose-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-top: 1px solid var(--border-color);
      background: var(--bg-surface);
    }
    .compose-send-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--color-google-blue);
      color: white;
      padding: 10px 24px;
      border-radius: var(--radius-full);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all var(--transition-fast);
    }
    .compose-send-btn:hover {
      box-shadow: var(--shadow-sm);
      filter: brightness(1.05);
    }

    /* ─── Right Companion Rail & Slide-In Side Panel ─── */
    #companion-rail {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      gap: 8px;
      border-left: 1px solid var(--border-subtle);
      background-color: var(--bg-surface);
      width: 56px;
      flex-shrink: 0;
      z-index: 20;
    }
    .rail-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      border: none;
      background: transparent;
    }
    .rail-btn:hover {
      background-color: var(--bg-hover);
      color: var(--text-primary);
      transform: scale(1.08);
    }
    .rail-btn.active {
      background-color: var(--bg-sidebar-active);
      color: var(--color-google-blue);
    }

    #side-panel {
      display: none;
      width: 340px;
      border-left: 1px solid var(--border-color);
      flex-direction: column;
      background: var(--bg-surface);
      overflow-y: auto;
      flex-shrink: 0;
      z-index: 20;
      animation: panel-slide-in 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes panel-slide-in {
      from { transform: translateX(40px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .side-panel-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .side-panel-header h3 {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
      color: var(--text-primary);
    }
    #side-panel-content {
      padding: 16px 20px;
      flex: 1;
      overflow-y: auto;
    }

    /* Prayer Times (Islamabad Namaz) */
    .prayer-times-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .prayer-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-radius: 8px;
      background: var(--bg-surface-variant);
      transition: all var(--transition-fast);
    }
    .prayer-item:hover {
      background: var(--bg-hover);
    }
    .prayer-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .prayer-time {
      font-size: 14px;
      color: var(--color-primary);
      font-weight: 700;
    }

    /* Calendar & Holidays */
    .mini-cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      margin-bottom: 20px;
    }
    .mini-cal-day-name {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-tertiary);
      padding: 6px 0;
    }
    .mini-cal-cell {
      text-align: center;
      font-size: 12px;
      color: var(--text-primary);
      padding: 6px 2px;
      border-radius: 50%;
      cursor: pointer;
      transition: background var(--transition-fast);
    }
    .mini-cal-cell:hover {
      background: var(--bg-hover);
    }
    .mini-cal-today {
      background: var(--color-google-blue) !important;
      color: white !important;
      font-weight: 700;
    }
    .holiday-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 12px;
      padding: 8px 12px;
      background: var(--bg-surface-variant);
      border-radius: 8px;
    }
    .holiday-dot {
      width: 10px;
      height: 10px;
      background: #d93025;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 4px;
    }
    .holiday-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .holiday-date {
      font-size: 11px;
      color: var(--text-tertiary);
    }

    /* Tasks & Notes */
    .side-panel-input, .side-panel-textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 13px;
      background: var(--bg-surface-variant);
      color: var(--text-primary);
      outline: none;
      box-sizing: border-box;
      margin-bottom: 8px;
      font-family: inherit;
    }
    .side-panel-input:focus, .side-panel-textarea:focus {
      border-color: var(--color-google-blue);
      background: var(--bg-surface);
    }
    .side-panel-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--color-google-blue);
      color: white;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      width: 100%;
      justify-content: center;
      margin-bottom: 14px;
    }
    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .task-done .task-text {
      text-decoration: line-through;
      color: var(--text-tertiary);
    }
    .task-text {
      font-size: 13px;
      color: var(--text-primary);
    }
    .note-card {
      background: var(--bg-surface-variant);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border-subtle);
    }
    .note-card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .note-card-content {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: pre-wrap;
      margin: 6px 0;
    }

    /* Contacts */
    .contact-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 6px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .contact-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .contact-email {
      font-size: 12px;
      color: var(--text-tertiary);
    }
    .contact-role {
      font-size: 11px;
      color: var(--color-primary);
      font-weight: 600;
    }

    /* ─── Modals, Dropdowns & Toasts ─── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 9000;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(2px);
    }
    .modal-dialog {
      background: var(--bg-surface);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      width: 520px;
      max-width: 95vw;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border-color);
      animation: modal-pop 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes modal-pop {
      from { transform: scale(0.94); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border-color);
    }
    .modal-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .modal-body {
      overflow-y: auto;
      padding: 20px 24px;
    }
    .settings-section-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 14px;
    }
    .settings-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .settings-label {
      font-size: 14px;
      color: var(--text-primary);
      min-width: 100px;
    }
    .theme-swatches {
      display: flex;
      gap: 10px;
    }
    .theme-swatch {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
      color: white;
    }
    .theme-swatch.active {
      border-color: var(--color-google-blue);
      transform: scale(1.1);
    }
    .theme-swatch-light   { background: #f6f8fc; border-color: #dadce0; color: #333; }
    .theme-swatch-dark    { background: #181a1b; }
    .theme-swatch-emerald { background: #0b6623; }
    .theme-swatch-slate   { background: #0f172a; }

    .density-options {
      display: flex;
      gap: 12px;
    }
    .density-option {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
    }
    .density-option.active {
      border-color: var(--color-google-blue);
      color: var(--color-google-blue);
      font-weight: 600;
    }

    .dropdown-menu {
      position: fixed;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      z-index: 9000;
      min-width: 190px;
      padding: 6px 0;
      overflow: hidden;
    }
    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
      font-size: 14px;
      color: var(--text-primary);
      cursor: pointer;
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      transition: background var(--transition-fast);
    }
    .dropdown-item:hover {
      background: var(--bg-hover);
    }

    .toast-notification {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #323232;
      color: white;
      border-radius: 8px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 500;
      z-index: 99999;
      opacity: 0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
    .toast-notification.toast-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: all;
    }
    .toast-undo-btn {
      color: #8ab4f8;
      font-weight: 700;
      font-size: 14px;
      margin-left: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    /* App Grid Dropdown */
    .app-grid-dropdown {
      position: fixed;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      z-index: 9000;
      padding: 20px;
      width: 300px;
    }
    .app-grid-title {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 16px;
    }
    .app-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .app-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 14px 8px;
      border-radius: 12px;
      cursor: pointer;
      border: none;
      background: transparent;
      transition: all var(--transition-fast);
    }
    .app-tile:hover {
      background: var(--bg-hover);
      transform: scale(1.05);
    }
    .app-tile-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    /* Profile Dropdown */
    .profile-dropdown {
      position: fixed;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      z-index: 9000;
      padding: 20px;
      min-width: 280px;
    }
    .profile-dropdown-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }
    .profile-avatar-lg {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0b6623, #15803d);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .profile-name-lg {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .profile-email-sm {
      font-size: 13px;
      color: var(--text-tertiary);
    }
    .profile-divider {
      border: none;
      border-top: 1px solid var(--border-subtle);
      margin: 10px 0;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
    }
    .empty-state-icon {
      font-size: 64px;
      color: var(--text-disabled);
      margin-bottom: 16px;
    }
    .empty-state-text {
      font-size: 16px;
      color: var(--text-tertiary);
    }

    #theme-icon {
      font-size: 22px;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #theme-toggle-btn:hover #theme-icon {
      transform: rotate(30deg);
    }
  </style>
</head>
<body>
<div id="app-root">

  <!-- ══════════════════════════════════════════════════════
       TOP HEADER BAR
       ══════════════════════════════════════════════════════ -->
  <header id="app-header">
    <!-- Left: Hamburger + Brand -->
    <div class="header-left">
      <button id="hamburger-btn" class="icon-btn" title="Toggle sidebar" aria-label="Toggle sidebar">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <a href="#" class="brand-logo-link" onclick="return false;">
        <div class="brand-logo-svg" title="Toggle Mail">
          <svg width="44" height="26" viewBox="0 0 48 28" fill="none" xmlns="http://www.w3.org/2000/svg" class="toggle-brand-logo">
            <defs>
              <linearGradient id="tg-brand-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#1A73E8"/>
                <stop offset="52%" stop-color="#34A853"/>
                <stop offset="100%" stop-color="#0B6623"/>
              </linearGradient>
              <filter id="tg-knob-shadow" x="-25%" y="-25%" width="150%" height="160%">
                <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25"/>
              </filter>
            </defs>
            <!-- Sleek Capsule Track (Google Blue to Sovereign Emerald Gradient) -->
            <rect x="1" y="1" width="46" height="26" rx="13" fill="url(#tg-brand-grad)"/>
            
            <!-- Sliding Knob in Active (ON) Position -->
            <circle cx="34" cy="14" r="10.5" fill="#FFFFFF" filter="url(#tg-knob-shadow)"/>
            
            <!-- Mail Envelope Icon inside the Knob -->
            <rect x="29" y="10" width="10" height="7.5" rx="1.2" fill="none" stroke="#0B6623" stroke-width="1.3"/>
            <path d="M29 10.5L34 14L39 10.5" stroke="#0B6623" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-text-container">
          <div class="brand-name">Toggle<span class="highlight">Mail</span></div>
        </div>
      </a>
    </div>

    <!-- Center: Search -->
    <div class="header-center">
      <form id="search-form" autocomplete="off">
        <div class="search-box" id="search-bar-container">
          <span class="material-symbols-outlined search-icon">search</span>
          <input type="text" id="search-input" placeholder="Search in mail (press / to focus)" autocomplete="off">
          <div class="search-actions">
            <button type="button" id="search-clear-btn" class="icon-btn" title="Clear search">
              <span class="material-symbols-outlined">close</span>
            </button>
            <button type="button" id="search-filter-btn" class="icon-btn" title="Search options">
              <span class="material-symbols-outlined">tune</span>
            </button>
          </div>
        </div>
      </form>
    </div>

    <!-- Right: Controls -->
    <div class="header-right">
      <button id="theme-toggle-btn" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
        <span id="theme-icon" class="material-symbols-outlined">light_mode</span>
      </button>

      <button id="lang-toggle-btn" class="icon-btn" title="Switch Language (EN / اردو)">
        <span class="material-symbols-outlined" style="font-size:18px">translate</span>
      </button>

      <button id="help-btn" class="icon-btn" title="Keyboard shortcuts (?)">
        <span class="material-symbols-outlined">help_outline</span>
      </button>

      <button id="settings-btn" class="icon-btn" title="Settings">
        <span class="material-symbols-outlined">settings</span>
      </button>

      <button id="app-grid-btn" class="icon-btn" title="Toggle Suite apps">
        <span class="material-symbols-outlined">apps</span>
      </button>

      <button id="profile-btn" class="profile-avatar-btn" title="Account">KM</button>
    </div>
  </header>

  <!-- ══════════════════════════════════════════════════════
       APP BODY
       ══════════════════════════════════════════════════════ -->
  <div id="app-body">

    <!-- Sidebar -->
    <aside id="app-sidebar" class="sidebar">
      <button id="sidebar-compose-btn" class="compose-btn" title="Compose new email">
        <span class="material-symbols-outlined">edit</span>
        <span class="compose-btn-text" data-i18n="compose">Compose</span>
      </button>

      <nav id="sidebar-nav" class="sidebar-nav-group"></nav>

      <div class="sidebar-section-header">
        <span class="sidebar-section-title" data-i18n="labels">Labels</span>
      </div>
      <div id="sidebar-labels" class="sidebar-nav-group"></div>

      <div class="storage-widget">
        <div class="storage-widget-header">
          <div class="storage-title">
            <span class="material-symbols-outlined storage-icon">cloud</span>
            <span>Storage</span>
          </div>
          <span class="storage-percent">49%</span>
        </div>
        <div class="storage-bar-track"><div class="storage-bar-fill"></div></div>
        <div class="storage-meta"><span data-i18n="storageUsed">12.4 GB of 25 GB used</span></div>
        <a href="#" class="storage-manage-link" onclick="return false;">
          <span>Manage storage</span>
          <span class="material-symbols-outlined" style="font-size:14px">open_in_new</span>
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main id="main-content-area">

      <!-- Category Tabs -->
      <div id="category-tabs"></div>

      <!-- Actions Bar -->
      <div id="list-actions-bar">
        <div class="actions-left">
          <button id="select-all-btn" class="icon-btn" title="Select">
            <span class="material-symbols-outlined" style="font-size:18px">arrow_drop_down</span>
          </button>
          <button id="refresh-btn" class="icon-btn" title="Refresh">
            <span class="material-symbols-outlined">refresh</span>
          </button>
          <button id="mark-all-read-btn" class="icon-btn" title="Mark all as read">
            <span class="material-symbols-outlined">done_all</span>
          </button>
        </div>
        <div class="actions-right">
          <span id="selected-count" style="font-size:13px;color:var(--text-tertiary)"></span>
        </div>
      </div>

      <!-- Bulk Actions Bar (visible when emails selected) -->
      <div id="bulk-actions-bar">
        <button id="bulk-archive-btn" class="icon-btn" title="Archive selected">
          <span class="material-symbols-outlined">archive</span>
        </button>
        <button id="bulk-delete-btn" class="icon-btn" title="Delete selected">
          <span class="material-symbols-outlined">delete</span>
        </button>
        <button id="bulk-read-btn" class="icon-btn" title="Mark as read">
          <span class="material-symbols-outlined">mark_email_read</span>
        </button>
        <button id="bulk-deselect-btn" class="icon-btn" title="Deselect all">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <!-- Email List View -->
      <div id="email-list-view">
        <div id="email-list"></div>
      </div>

      <!-- Email Detail View -->
      <div id="email-detail-view"></div>

    </main>

    <!-- Companion Rail and Side Panel removed -->
  </div><!-- /app-body -->

</div><!-- /app-root -->

<!-- Vite / TypeScript Entry Point -->
<script type="module" src="/src/main.ts"></script>
</body>
</html>
