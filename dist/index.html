  <!-- Service Worker / Cache Buster: Unregister any stale worker on localhost -->
  <script>
    (function() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          if (registrations.length > 0) {
            console.warn('[ToggleMail] Unregistering stale ServiceWorker(s)...');
            Promise.all(registrations.map(function(r) { return r.unregister(); })).then(function() {
              if ('caches' in window) {
                caches.keys().then(function(names) {
                  return Promise.all(names.map(function(n) { return caches.delete(n); }));
                }).then(function() {
                  console.warn('[ToggleMail] ServiceWorkers & caches cleared, reloading cleanly...');
                  window.location.reload();
                });
              } else {
                window.location.reload();
              }
            });
          }
        });
      }
    })();
  </script>
